<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 120" width="100%" height="100%">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a3d62" />
      <stop offset="50%" stop-color="#0f4c81" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0a3d62" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Graphic Emblem (Shield & 3-Generations Arch with Droplet) -->
  <g transform="translate(10, 10)" filter="url(#subtleShadow)">
    <!-- Protective Shield Outer -->
    <path d="M 50 5 Q 75 5 95 18 C 95 60 70 88 50 96 C 30 88 5 60 5 18 Q 25 5 50 5 Z" 
          fill="url(#blueGrad)" />
    
    <!-- 3 Generations Arches / Leaves in Emerald Green -->
    <!-- Gen 1: Left Pillar Arch -->
    <path d="M 28 65 C 24 50 26 35 34 26 C 37 36 36 52 30 65 Z" fill="url(#greenGrad)" />
    <!-- Gen 2: Right Pillar Arch -->
    <path d="M 72 65 C 76 50 74 35 66 26 C 63 36 64 52 70 65 Z" fill="url(#greenGrad)" />
    <!-- Gen 3: Central Waterdrop Core -->
    <path d="M 50 22 C 57 34 62 46 62 55 C 62 62 56 68 50 68 C 44 68 38 62 38 55 C 38 46 43 34 50 22 Z" 
          fill="#ffffff" />
    <!-- Droplet Center Emerald Accent -->
    <path d="M 50 32 C 54 40 57 48 57 55 C 57 59 54 63 50 63 C 46 63 43 59 43 55 C 43 48 46 40 50 32 Z" 
          fill="url(#greenGrad)" />

    <!-- 3 Generation Stars / Jewels along Top -->
    <circle cx="36" cy="14" r="2.5" fill="#f59e0b" />
    <circle cx="50" cy="11" r="3" fill="#f59e0b" />
    <circle cx="64" cy="14" r="2.5" fill="#f59e0b" />
  </g>

  <!-- Typography -->
  <g transform="translate(125, 20)">
    <!-- Primary Brand Name -->
    <text x="0" y="38" font-family="'Space Grotesk', 'Plus Jakarta Sans', system-ui, sans-serif" font-size="34" font-weight="800" letter-spacing="1.5" fill="#0f4c81">
      SLN <tspan fill="#059669">ENGINEERS</tspan>
    </text>
    
    <!-- Subtitle / Entity Type -->
    <text x="0" y="58" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#475569">
      PROJECTS PVT. LTD.
    </text>
    
    <!-- Divider Line with Gradient -->
    <rect x="0" y="66" width="380" height="2" fill="url(#greenGrad)" rx="1" />
    
    <!-- Iconic Tagline -->
    <text x="0" y="82" font-family="'Plus Jakarta Sans', Georgia, serif" font-size="13" font-weight="600" font-style="italic" letter-spacing="1" fill="#0284c7">
      “Restoration for Three Generations”
    </text>
  </g>
</svg>
